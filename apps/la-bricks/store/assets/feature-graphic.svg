<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500" role="img" aria-label="LA-Bricks">
  <title>LA-Bricks</title>

  <!--
    Play-Store-Feature-Grafik, 1024 x 500.
    Der Store blendet je nach Platzierung Symbol und Titel darueber ein und
    beschneidet die Raender — Schriftzug und Motiv bleiben deshalb innerhalb
    der mittleren rund 80 Prozent.
  -->

  <defs>
    <!-- Schriftzug: grosse Bounding-Box, vertraegt weite Unschaerfe -->
    <filter id="g-green" x="-100%" y="-250%" width="300%" height="600%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"  result="b1"/>
      <feGaussianBlur stdDeviation="16" result="b2"/>
      <feGaussianBlur stdDeviation="32" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/><feMergeNode in="b2"/>
        <feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Kleinobjekte: Bereich gross genug, damit der Glow nicht als
         Rechteck abgeschnitten wird -->
    <filter id="g-soft" x="-200%" y="-200%" width="500%" height="500%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="9" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/><feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="g-ball" x="-300%" y="-300%" width="700%" height="700%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"  result="b1"/>
      <feGaussianBlur stdDeviation="12" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/><feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="bg" cx="42%" cy="50%" r="80%">
      <stop offset="0%"   stop-color="#0e1a10"/>
      <stop offset="60%"  stop-color="#070b07"/>
      <stop offset="100%" stop-color="#020402"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Raster -->
  <g stroke="#4dff6a" stroke-opacity="0.12" stroke-width="1.5">
    <path d="M0 62H1024M0 124H1024M0 186H1024M0 248H1024M0 310H1024M0 372H1024M0 434H1024"/>
    <path d="M62 0V500M124 0V500M186 0V500M248 0V500M310 0V500M372 0V500M434 0V500
             M496 0V500M558 0V500M620 0V500M682 0V500M744 0V500M806 0V500M868 0V500M930 0V500"/>
  </g>

  <!-- Motiv rechts: Steinwand, Ball, Paddle -->
  <g transform="translate(676 0)">
    <g filter="url(#g-soft)" fill-opacity="0.18" stroke-width="3.5">
      <g fill="#ff3ce0" stroke="#ff3ce0">
        <rect x="0"  y="104" width="76" height="30" rx="2"/>
        <rect x="84" y="104" width="76" height="30" rx="2"/>
        <rect x="168" y="104" width="76" height="30" rx="2"/>
      </g>
      <g fill="#ffe066" stroke="#ffe066">
        <rect x="0"  y="142" width="76" height="30" rx="2"/>
        <rect x="84" y="142" width="76" height="30" rx="2"/>
        <rect x="168" y="142" width="76" height="30" rx="2"/>
      </g>
      <g fill="#4dff6a" stroke="#4dff6a">
        <rect x="0"   y="180" width="76" height="30" rx="2"/>
        <rect x="168" y="180" width="76" height="30" rx="2"/>
      </g>
    </g>

    <!-- Flugbahn -->
    <path d="M122 196 L104 268 L150 330" stroke="#4dff6a" stroke-opacity="0.38"
          stroke-width="2.5" stroke-dasharray="7 9" fill="none"/>

    <g filter="url(#g-ball)">
      <circle cx="150" cy="330" r="15" fill="#4dff6a"/>
      <circle cx="150" cy="330" r="7"  fill="#c8ffd2"/>
    </g>

    <g filter="url(#g-soft)">
      <rect x="86" y="386" width="150" height="20" rx="2"
            fill="#4dff6a" fill-opacity="0.30" stroke="#4dff6a" stroke-width="4"/>
      <path d="M86 386H236" stroke="#c8ffd2" stroke-width="2.5" stroke-opacity="0.7"/>
    </g>
  </g>

  <!-- Wortmarke links -->
  <g font-family="ui-monospace, 'DejaVu Sans Mono', 'Roboto Mono', monospace">
    <text x="92" y="238" filter="url(#g-green)"
          font-size="108" font-weight="700" letter-spacing="19"
          fill="#c8ffd2">BRICKS</text>

    <text x="99" y="300" filter="url(#g-soft)"
          font-size="38" font-weight="700" letter-spacing="30"
          fill="#ffd6f8">&#8211; LA &#8211;</text>

    <text x="99" y="372"
          font-size="21" font-weight="400" letter-spacing="7.5"
          fill="#4dff6a" fill-opacity="0.62">NEON-ARCADE-BREAKOUT</text>

    <text x="99" y="408"
          font-size="17" font-weight="400" letter-spacing="5"
          fill="#4dff6a" fill-opacity="0.34">OFFLINE &#183; OHNE WERBUNG &#183; OHNE KONTO</text>
  </g>

  <!-- Scanlines -->
  <g stroke="#000" stroke-opacity="0.22" stroke-width="1.5">
    <path d="M0 3H1024M0 9H1024M0 15H1024M0 21H1024M0 27H1024M0 33H1024M0 39H1024
             M0 45H1024M0 51H1024M0 57H1024M0 63H1024M0 69H1024M0 75H1024M0 81H1024
             M0 87H1024M0 93H1024M0 99H1024M0 105H1024M0 111H1024M0 117H1024
             M0 123H1024M0 129H1024M0 135H1024M0 141H1024M0 147H1024M0 153H1024
             M0 159H1024M0 165H1024M0 171H1024M0 177H1024M0 183H1024M0 189H1024
             M0 195H1024M0 201H1024M0 207H1024M0 213H1024M0 219H1024M0 225H1024
             M0 231H1024M0 237H1024M0 243H1024M0 249H1024M0 255H1024M0 261H1024
             M0 267H1024M0 273H1024M0 279H1024M0 285H1024M0 291H1024M0 297H1024
             M0 303H1024M0 309H1024M0 315H1024M0 321H1024M0 327H1024M0 333H1024
             M0 339H1024M0 345H1024M0 351H1024M0 357H1024M0 363H1024M0 369H1024
             M0 375H1024M0 381H1024M0 387H1024M0 393H1024M0 399H1024M0 405H1024
             M0 411H1024M0 417H1024M0 423H1024M0 429H1024M0 435H1024M0 441H1024
             M0 447H1024M0 453H1024M0 459H1024M0 465H1024M0 471H1024M0 477H1024
             M0 483H1024M0 489H1024M0 495H1024"/>
  </g>
</svg>
